name: trading-bot

on:
  schedule:
    - cron: "*/5 22-23 * * 0"
    - cron: "*/5 * * * 1-4"
    - cron: "*/5 0-21 * * 5"
  workflow_dispatch:
    inputs:
      test:
        description: "اكتب 1 لإرسال رسالة اختبار فقط"
        default: "0"
      backtest:
        description: "اكتب 1 لتشغيل Backtest بدل التشغيل العادي"
        default: "0"

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install -r requirements-bot.txt
      - name: Run bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MSG: ${{ github.event.inputs.test }}
          BACKTEST: ${{ github.event.inputs.backtest }}
          MIN_ZONE_SCORE: "5"
          IMP_ATR: "1.4"
          HEARTBEAT_HOURS: "2"
          PIERCE_ATR: "0.30"
          BODY_MIN: "0.40"
          MIN_RANGE_ATR: "0.4"
          MIN_RR: "1.3"
          WALL_MIN_SCORE: "10"
          BOUNCE_ON: "0"
          RETEST_ON: "0"
          MSS_ON: "0"
          MIN_TP_PIPS: "40"
          MIN_TP1_PIPS: "30"
        run: python bot2.py
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f state.json ]; then
            cp state.json /tmp/state.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.json state.json
            git add state.json
            git diff --cached --quiet || (git commit -m "state" && git push)
          fi
